name: Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
      
      - name: Set SDK flag
        run: |
          echo "=== Using R2 SDK for direct upload ==="
          export R2_USE_SDK=true
      
      # - name: List latest R2 objects for diagnostics
      #   run: |
      #     echo "=== List latest objects ==="
      #     npx wrangler r2 object list ${{ secrets.R2_BUCKET }} --limit 5
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Install AWS SDK dependencies
        run: npm install --no-save @aws-sdk/client-s3 @aws-sdk/s3-request-presigner
        
      - name: Transpile helper to JS
        run: npx tsc api/r2-client.ts --outDir dist/api --module ESNext --target ES2019 --esModuleInterop --moduleResolution nodenext

      - name: Upload preview to R2
        id: upload
        run: |
          node scripts/upload-preview.js
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_USE_SDK: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Post PR comment
        id: comment
        run: |
          node scripts/post-pr-comment.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_USE_SDK: true
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
