name: Preview Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: "--experimental-vm-modules"
      
      - name: Set SDK flag
        run: |
          echo "=== Using R2 SDK for direct upload ==="
          export R2_USE_SDK=true
      
      # - name: List latest R2 objects for diagnostics
      #   run: |
      #     echo "=== List latest objects ==="
      #     npx wrangler r2 object list ${{ secrets.R2_BUCKET }} --limit 5
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Install AWS SDK dependencies
        run: npm install --no-save @aws-sdk/client-s3 @aws-sdk/s3-request-presigner
        
      - name: Setup AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto
          
      - name: Install AWS CLI
        run: |
          sudo apt-get update && sudo apt-get install -y awscli
          aws --version
      
      - name: Set AWS CLI permissions for R2 upload script
        run: chmod +x scripts/r2-cli-upload.sh
        
      - name: Transpile helper to JS
        run: npx tsc api/r2-client.ts --outDir dist/api --module NodeNext --target ES2019 --esModuleInterop --moduleResolution nodenext

      - name: Curl R2 endpoint
        run: |
          echo "Testing TLS handshake..."
          curl -I https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com/${{ secrets.R2_BUCKET }}/ || true

      - name: Upload preview to R2 (CLI approach)
        id: upload-cli
        continue-on-error: true
        run: |
          echo "Attempting R2 upload using AWS CLI (most reliable approach)..."
          chmod +x ./scripts/r2-cli-upload.sh
          ./scripts/r2-cli-upload.sh
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          
      - name: Upload preview to R2 (fallback to Node.js)
        id: upload
        if: ${{ steps.upload-cli.outcome == 'failure' }}
        run: |
          echo "AWS CLI approach failed, falling back to Node.js upload..."
          node scripts/upload-preview.js
        env:
          # Ensure CF_ACCOUNT_ID doesn't have a trailing period
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Try both approaches for maximum redundancy
          R2_USE_DIRECT: true
          R2_USE_SDK: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Post PR comment
        id: comment
        run: |
          node scripts/post-pr-comment.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_USE_SDK: true
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
