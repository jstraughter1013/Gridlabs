<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GridLabs UI quick-smoke</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="space-y-6 text-center">
    <h1 class="text-4xl font-bold text-indigo-600">🚀 GridLabs UI Components</h1>

    <!-- mount point for a real component -->
    <div id="demo-root" class="mx-auto w-[22rem] p-6 bg-white rounded shadow">
      <p class="mb-4 text-gray-700">If you see this, the bundle hasn't loaded 😅</p>
    </div>

    <script type="module">
      // naive, but works for a smoke test
      import { Button } from '../src/components'
      const root = document.getElementById('demo-root')
      root.innerHTML = ''
      const btn = document.createElement('button')
      btn.textContent = 'Click me'
      btn.className = Button.defaultClass    // or however you export styles
      root.appendChild(btn)
    </script>
  </div>
</body>
</html>
